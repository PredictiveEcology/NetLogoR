on:
  push:
    branches:
      - main
      - master
      - development
  pull_request:
    branches:
      - main
      - master
      - development

name: R-CMD-check

jobs:
  R-CMD-check:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, nosuggests ${{ matrix.config.nosuggests }})

    strategy:
      fail-fast: false
      matrix:
        config:
          ## TEMPORARY: qs2's macOS CRAN binary is ABI-incompatible with RcppParallel >= 6.0.0,
          ## so it must be rebuilt from source (qsbase/qs2#30). macOS binaries lag several days
          ## behind source updates; drop `extra` once CRAN ships a rebuilt qs2 binary.
          - {os: macOS-latest,    nosuggests: false, r: 'release', extra: 'qs2?source'}
          - {os: windows-latest,  nosuggests: false, r: 'devel'}
          - {os: windows-latest,  nosuggests: false, r: 'release'}
          - {os: windows-latest,  nosuggests: false, r: 'oldrel-1'}
          - {os: windows-latest,  nosuggests: false, r: 'oldrel-2'}
          - {os: windows-latest,  nosuggests: false, r: 'oldrel-3'} ## R (>= 4.3) per DESCRIPTION
          - {os: ubuntu-latest,   nosuggests: false, r: 'devel'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'release'}
          - {os: ubuntu-latest,   nosuggests: true,  r: 'release'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'oldrel-1'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'oldrel-2'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'oldrel-3'} ## R (>= 4.3) per DESCRIPTION

    env:
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.nosuggests }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@main

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          r-version: ${{ matrix.config.r }}
          Ncpus: 2
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.extra }}
            PredictiveEcology/quickPlot@development
            PredictiveEcology/reproducible@development
            PredictiveEcology/Require@development
            PredictiveEcology/SpaDES.core@development
            PredictiveEcology/SpaDES.tools@development

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
