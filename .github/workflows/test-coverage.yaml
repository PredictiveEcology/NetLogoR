on:
  push:
    branches:
      - main
      - master
      - development
  pull_request:
    branches:
      - main
      - master
      - development

name: test-coverage

jobs:
  test-coverage:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@main

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          ## TEMPORARY: qs2's macOS CRAN binary is ABI-incompatible with RcppParallel >= 6.0.0,
          ## so it must be rebuilt from source (qsbase/qs2#30). macOS binaries lag several days
          ## behind source updates; drop `qs2?source` once CRAN ships a rebuilt qs2 binary.
          extra-packages: |
            any::covr
            qs2?source
            PredictiveEcology/quickPlot@development
            PredictiveEcology/reproducible@development
            PredictiveEcology/Require@development
            PredictiveEcology/SpaDES.core@development
            PredictiveEcology/SpaDES.tools@development

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
